<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توليد QR الطلاب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<style>
body{
    font-family:'Cairo',sans-serif;
    background: linear-gradient(135deg,#9b59b6,#8e44ad); /* بنفسجي عصرية */
    margin:0;padding:0;
}
.container{
    padding:20px;
    width:100%;
    max-width:480px;
    margin:auto;
    background: rgba(255,255,255,0.95);
    border-radius:20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    margin-top:30px;
    animation: fadeIn 1s ease;
}
h2{
    text-align:center;
    font-weight:700;
    font-size:24px;
    background: linear-gradient(90deg,#b39ddb,#7e57c2); /* عنوان بنفسجي متدرج */
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: colorShift 5s infinite alternate;
}
input, select{
    width:100%;
    padding:12px;
    margin-top:12px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:16px;
}
button{
    width:100%;
    background: linear-gradient(90deg,#9b59b6,#8e44ad); /* بنفسجي الزر */
    color:white;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:17px;
    cursor:pointer;
    margin-top:15px;
    transition: all 0.3s ease;
}
button:hover{
    transform: scale(1.05);
    background: linear-gradient(90deg,#8e44ad,#9b59b6);
}
#qrcode{
    margin-top:25px;
    text-align:center;
    transition: transform 0.5s ease;
}
@keyframes colorShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
@keyframes fadeIn{
    0%{opacity:0; transform: translateY(30px);}
    100%{opacity:1; transform: translateY(0);}
}
</style>
</head>
<body>
<div class="container">
<h2>توليد QR الحضور</h2>

<input type="text" id="name" placeholder="الاسم">
<input type="text" id="seat" placeholder="رقم الجلوس">
<input type="text" id="program" placeholder="البرنامج">

<label>اليوم:</label>
<select id="day">
  <option value="الخميس">الخميس</option>
  <option value="الأربعاء">الأربعاء</option>
</select>

<label>الوقت:</label>
<select id="time">
  <option value="9 ص">9 ص</option>
  <option value="10:30 ص">10:30 ص</option>
  <option value="12:10 م">12:10 م</option>
  <option value="1:45 م">1:45 م</option>
  <option value="3:20 م">3:20 م</option>
</select>

<button onclick="generateQR()">توليد QR</button>

<div id="qrcode"></div>
</div>

<script>
function generateQR(){
    const name = document.getElementById('name').value.trim();
    const seat = document.getElementById('seat').value.trim();
    const program = document.getElementById('program').value.trim();
    const day = document.getElementById('day').value;
    const time = document.getElementById('time').value;

    if(!name || !seat || !program){
        alert('من فضلك اكمل كل البيانات');
        return;
    }

    const qrData = JSON.stringify({
        name, seat, section: program, day, time
    });

    const qrContainer = document.getElementById('qrcode');
    qrContainer.innerHTML = '';
    const qr = new QRious({
        element: qrContainer,
        value: qrData,
        size: 250
    });

    qrContainer.style.transform = 'scale(0)';
    setTimeout(()=>{ qrContainer.style.transform='scale(1)'; },50);
}
</script>
</body>
</html>
